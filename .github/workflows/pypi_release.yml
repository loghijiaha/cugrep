
name: Upload Python Package

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'python/pycugrep/**'
      - 'python/setup.py'
      - 'python/pyproject.toml'
      - 'python/README.md'
      - 'python/LICENSE'
  # Optional: also allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dists:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          python -m pip install build
          python -m pip install setuptools wheel # Ensure setuptools and wheel are installed for build

      - name: Get package version
        id: get_version
        run: |
          # Extract version from setup.py
          BASE_VERSION=$(python -c "import re; print(re.search(r"version=['"]([0-9.]+?)['"]", open('python/setup.py').read()).group(1))")
          DYNAMIC_VERSION="${BASE_VERSION}.post${{ github.run_number }}"
          echo "Setting dynamic version: ${DYNAMIC_VERSION}"
          echo "version=${DYNAMIC_VERSION}" >> $GITHUB_OUTPUT

      - name: Build distributions
        run: python -m build python/ # Build from the python/ subdirectory

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dists
          path: python/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build-dists
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    environment:
      name: pypi
      url: https://pypi.org/project/pycugrep/

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          version: ${{ needs.build-dists.outputs.version }}
